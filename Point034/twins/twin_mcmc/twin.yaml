schema: molonari-twin/2.0.0
name: twin_mcmc
description: Inversion MCMC courte monocouche (réglages de twin_03), comparée au modèle direct twin_direct
mode: mcmc
data: {lab: Laboratory, point: SamplingPoints/Point034}
processing: {start: '2016-06-27 13:00', end: '2016-07-12 10:15'}
site_label: Site de démonstration A
monitoring: {status: inactif}
layers:
- {name: sédiments, z_low: 0.4}
numerics: {nb_cells: 50, initial_condition: linear}
mcmc:
  priors:
  - neg_log10_k: [11, 15]
    porosity: [0.01, 0.25]
    lambda_s: [1, 5]
    rhos_cs: [1000000, 10000000]
  nb_chains: 8
  nb_iter: 300
  burn_in_max: 300
  delta: 3
  n_cr: 3
  c: 0.1
  c_star: 1.0e-06
  gr_threshold: 1.2
  quantiles: [0.05, 0.5, 0.95]
  n_field_samples: 40
  space_step: 1
  time_step: 1
report:
  models: {forward: twin_direct, inversion: twin_mcmc}
  entries:
  - {question: water_flux, parameters: {level: 0.9}}
  - {question: fit_quality}
